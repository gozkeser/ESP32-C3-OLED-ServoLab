name: Build and Release ESP32-C3 Firmware

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO Core
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build firmware
        run: pio run -e esp32-c3-devkitm-1

      - name: Prepare release binaries
        run: |
          mkdir -p release_assets
          BUILD_DIR=".pio/build/esp32-c3-devkitm-1"
          TAG_NAME="${{ github.ref_name }}"
          
          cp "$BUILD_DIR/firmware.bin" "release_assets/firmware_${TAG_NAME}.bin"
          cp "$BUILD_DIR/bootloader.bin" "release_assets/bootloader_${TAG_NAME}.bin"
          cp "$BUILD_DIR/partitions.bin" "release_assets/partitions_${TAG_NAME}.bin"

      - name: Create GitHub Release and Upload Binaries
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
