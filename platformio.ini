; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

; --- C++ Standard & Compiler Flags ---
build_unflags = -std=gnu++11
build_flags = 
    -std=gnu++17
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -I $PROJECT_DIR/src
    -O2

; --- Flash Partition Scheme ---
board_build.partitions = min_spiffs.csv

; --- External Libraries ---
lib_deps = 
    olikraus/U8g2@^2.32.15
    h2zero/NimBLE-Arduino @ ^2.5.0
    https://github.com/gb88/BLEOTA.git#v1.0.6

; --- Serial Monitor ---
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; --- Debugging (JTAG ile Hata Ayıklama Devam Eder) ---
debug_tool = esp-builtin
debug_init_break = tbreak setup

; 🚀 YÜKLEME HIZLANDIRMA (esptool kullanımı)
; OpenOCD hantallığı yerine doğrudan USB-CDC / esptool ile ışık hızında yükleme yapar.
upload_protocol = esptool
upload_speed = 921600